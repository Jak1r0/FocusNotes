apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    hermesCommand = file("../../../../node_modules/react-native/sdks/hermesc/win64-bin/hermesc.exe").absolutePath
    autolinkLibrariesWithApp()
}

android {
    namespace "com.focusnotes"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    defaultConfig {
        applicationId "com.focusnotes"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            def props = rootProject.ext.signingProps
            storeFile file(props.getProperty("FN_RELEASE_STORE_FILE", "focusnotes-release.jks"))
            storePassword props.getProperty("FN_RELEASE_STORE_PASSWORD", "")
            keyAlias props.getProperty("FN_RELEASE_KEY_ALIAS", "focusnotes")
            keyPassword props.getProperty("FN_RELEASE_KEY_PASSWORD", "")
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }
    buildTypes {
        debug { buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false" }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
